<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Retail POS</title>

    <link rel="stylesheet" href="/pos/style.css">
</head>

<body>


<header class="shop-header">

    <div class="shop-brand">
        <div class="shop-name-row">
            <span class="shop-brand-mark">ဝါ</span>
            <div>
                <h1>ဝါဝါသင်္ကန်းတိုက်</h1>
            </div>
        </div>

        <div class="header-actions">
            <a href="/pos/dashboard.html" class="back-button">
                Dashboard
            </a>
            
            <a href="/pos/stock.html" class="back-button">
                Stock
            </a>

            <a href="/pos/history.html" class="back-button">
                Sales History
            </a>

        </div>

</header>

    


    <main class="pos-container">

        <!-- LEFT SIDE -->
        <section class="products-section">

            <h2>Products</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search product..."
            >

            <div class="category-tabs">
                <button
                    class="category-button active"
                    data-group="ALL"
                >
                ALL
               </button>

               <button
                 class="category-button"
                data-group="RH"
                > 
                ရဟန်းဒွိစုံ
                </button>

                <button
                class="category-button"
                data-group="SH"
               >
               ရှင်ဆောင်ဒွိစုံ
               </button>

                <button
                class="category-button"
                data-group="DK"
                >
                 ဒုကုဋ်
                </button>

            </div>

            <div id="productList" class="product-grid">
                <!-- Products will come from PostgreSQL -->
            </div>

        </section>


        <!-- RIGHT SIDE -->
        <section class="cart-section">

            <h2>Current Sale</h2>

            <div id="cartList">
                <p class="empty-cart">
                    No items added yet.
                </p>
            </div>


            <!-- SUMMARY -->
            <div class="summary">

                <div>
                    <span>Subtotal</span>
                    <strong id="subtotal">
                        0 MMK
                    </strong>
                </div>

            </div>


            <!-- CHECKOUT -->
            <div class="checkout">

                <label for="discountInput">
                    Discount
                </label>

                <input
                    type="number"
                    id="discountInput"
                    value="0"
                    min="0"
                >


                <label for="paymentMethod">
                    Payment Method
                </label>

                <select id="paymentMethod">
                    <option value="Cash">Cash</option>
                    <option value="KBZPay">KBZPay</option>
                    <option value="WavePay">WavePay</option>
                </select>


                <label for="amountPaidInput">
                    Amount Received
                </label>

                <input
                    type="number"
                    id="amountPaidInput"
                    min="0"
                    placeholder="Enter amount received"
                >


                <div class="checkout-row">

                    <span>Total</span>

                    <strong id="grandTotal">
                        0 MMK
                    </strong>

                </div>


                <div class="checkout-row">

                    <span>Change</span>

                    <strong id="changeAmount">
                        0 MMK
                    </strong>

                </div>


                <button id="payButton">
                    PAY
                </button>

            </div>

        </section>

    </main>

    <!-- RECEIPT MODAL -->

<div id="receiptModal" class="receipt-modal">

    <div class="receipt">

        <div class="receipt-header">
            <h2>SHOP NAME</h2>
            <p>Sales Receipt</p>
        </div>

        <div class="receipt-info">
            <p>
                Invoice:
                <span id="receiptInvoice"></span>
            </p>

            <p>
                Date:
                <span id="receiptDate"></span>
            </p>

            <p>
                Time:
                <span id="receiptTime"></span>
            </p>
        </div>

        <hr>

        <div id="receiptItems"></div>

        <hr>

        <div class="receipt-total-row">
            <span>Subtotal</span>
            <span id="receiptSubtotal"></span>
        </div>

        <div class="receipt-total-row">
            <span>Discount</span>
            <span id="receiptDiscount"></span>
        </div>

        <div class="receipt-total-row receipt-grand-total">
            <span>TOTAL</span>
            <span id="receiptGrandTotal"></span>
        </div>

        <div class="receipt-total-row">
            <span>Paid</span>
            <span id="receiptPaid"></span>
        </div>

        <div class="receipt-total-row">
            <span>Change</span>
            <span id="receiptChange"></span>
        </div>

        <div class="receipt-total-row">
            <span>Payment</span>
            <span id="receiptPayment"></span>
        </div>

        <p class="receipt-thanks">
            Thank you
        </p>

        <div class="receipt-buttons">
            <button id="printReceiptButton">
                PRINT
            </button>

            <button id="closeReceiptButton">
                CLOSE
            </button>
        </div>

    </div>

</div>


    <script src="/pos/app.js"></script>

</body>

</html>
