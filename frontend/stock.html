<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stock Management</title>

    <link rel="stylesheet" href="/pos/style.css">
</head>

<body>

    <header class="history-header">

        <div>
            <h1>Stock Management</h1>
            <p>Manage product inventory</p>
        </div>

        <a href="/pos/" class="back-button">
            ← New Sale
        </a>

    </header>


    <main class="stock-container">

        <input
            type="text"
            id="stockSearch"
            placeholder="Search product..."
        >

        <div class="stock-filters">

    <div class="filter-section">

        <span class="filter-label">
            Supplier
        </span>

        <div class="filter-buttons">

            <button
                class="supplier-filter active"
                data-supplier="ALL"
            >
                All
            </button>

            <button
                class="supplier-filter"
                data-supplier="YM"
            >
                ရတနာမွန်
            </button>

            <button
                class="supplier-filter"
                data-supplier="LN"
            >
                လောကနတ်
            </button>

        </div>

    </div>


    <div class="filter-section">

        <span class="filter-label">
            Product Group
        </span>

        <div class="filter-buttons">

            <button
                class="group-filter active"
                data-group="ALL"
            >
                All
            </button>

            <button
                class="group-filter"
                data-group="RH"
            >
                ရဟန်းဒွိစုံ
            </button>

            <button
                class="group-filter"
                data-group="SH"
            >
                ရှင်ဆောင်ဒွိစုံ
            </button>

            <button
                class="group-filter"
                data-group="DK"
            >
                ဒုကုဋ်
            </button>

        </div>

    </div>

</div>


        <div class="stock-table-wrapper">

            <table class="stock-table">

                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Product</th>
                        <th>Supplier</th>
                        <th>Group</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="stockTableBody">
                </tbody>

            </table>

        </div>

    </main>


    <!-- RESTOCK MODAL -->

    <div id="restockModal" class="receipt-modal">

        <div class="restock-box">

            <h2 id="restockModalTitle">Restock Product</h2>

            <p id="restockProductName"></p>

            <p>
                Current Stock:
                <strong id="restockCurrentStock"></strong>
            </p>

            <label 
                for="restockQuantity"
                id="restockQuantityLabel"
            >
                Quantity to Add
            </label>

            <input
                type="number"
                id="restockQuantity"
                min="1"
                placeholder="Enter quantity"
            >


            <div class="receipt-buttons">

                <button id="confirmRestockButton">
                    UPDATE
                </button>

                <button id="cancelRestockButton">
                    CANCEL
                </button>

            </div>

        </div>

    </div>

    <!-- EDIT PRICE MODAL -->

<div id="priceModal" class="receipt-modal">

    <div class="restock-box">

        <h2>Edit Price</h2>

        <p id="priceProductName"></p>

        <p>
            Current Price:
            <strong id="currentPrice"></strong>
        </p>

        <label for="newPrice">
            New Selling Price
        </label>

        <input
            type="number"
            id="newPrice"
            min="1"
            placeholder="Enter new price"
        >

        <div class="receipt-buttons">

            <button id="savePriceButton">
                SAVE PRICE
            </button>

            <button id="cancelPriceButton">
                CANCEL
            </button>

        </div>

    </div>

</div>


    <script src="/pos/stock.js"></script>

</body>

</html>
