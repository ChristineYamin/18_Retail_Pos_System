<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stock Management</title>

    <link rel="stylesheet" href="/pos/style.css?v=21">
</head>

<body>

    <header class="history-header">

        <div>
            <h1>Stock Management</h1>
            <p>Manage product inventory</p>
        </div>

        <a href="/pos/" class="back-button">
            ← New Sale
        </a>

    </header>


    <main class="stock-container">

        <input
            type="text"
            id="stockSearch"
            placeholder="Search product..."
        >

    <div class="stock-filters">

    <div class="filter-section">

        <label
            class="filter-label"
            for="stockSupplierFilter"
        >
            Supplier
        </label>

        <select id="stockSupplierFilter">

            <option value="ALL">
                All Suppliers
            </option>

            <option value="YM">
                ရတနာမွန်
            </option>

            <option value="LN">
                လောကနတ်
            </option>

            <option value="UNKNOWN">
                Not Assigned
            </option>

        </select>

    </div>


    <div class="filter-section">

        <label
            class="filter-label"
            for="stockGroupFilter"
        >
            Product Group
        </label>

        <select id="stockGroupFilter">

            <option value="ALL">All Groups</option>

            <option value="RH">ရဟန်းဒွိစုံ</option>
            <option value="SH">ရှင်ဆောင်ဒွိစုံ</option>
            <option value="DK">ဒုကုဋ်</option>

            <option value="UM">ထီး</option>
            <option value="GU">ထီးဖြူ / ရွှေထီး</option>
            <option value="FW">ဖိနပ်</option>
            <option value="FN">ယပ်</option>
            <option value="BW">ခြုံထည် / ကိုယ်ပတ်</option>
            <option value="MT">ခြေသုတ်ခုံ / နေရာထိုင်</option>
            <option value="KR">ကြာသင်္ကန်း</option>
            <option value="MC">မျက်နှာကြက်</option>
            <option value="RF">သာသနာ့အလံ</option>
            <option value="AB">သပိတ် / သပိတ်လွယ်</option>
            <option value="AK">အန္တကိုက်</option>
            <option value="SL">သီလရှင်</option>
            <option value="BG">အိတ်</option>
            <option value="SW">ဆွယ်တာ / အနွေးထည်</option>
            <option value="WB">ခါးပန်းကြိုး</option>
            <option value="KS">ဓားဘူး</option>
            <option value="MA">ဘုန်းကြီးအသုံးအဆောင်</option>

        </select>

    </div>

</div>

        




        <div class="stock-table-wrapper">

            <table class="stock-table">

                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Product</th>
                        <th>Supplier</th>
                        <th>Group</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="stockTableBody">
                </tbody>

            </table>

        </div>

    </main>


    <!-- RESTOCK MODAL -->

    <div id="restockModal" class="receipt-modal">

        <div class="restock-box">

            <h2 id="restockModalTitle">Restock Product</h2>

            <p id="restockProductName"></p>

            <p>
                Current Stock:
                <strong id="restockCurrentStock"></strong>
            </p>

            <label 
                for="restockQuantity"
                id="restockQuantityLabel"
            >
                Quantity to Add
            </label>

            <input
                type="number"
                id="restockQuantity"
                min="1"
                placeholder="Enter quantity"
            >


            <div class="receipt-buttons">

                <button id="confirmRestockButton">
                    UPDATE
                </button>

                <button id="cancelRestockButton">
                    CANCEL
                </button>

            </div>

        </div>

    </div>

    <!-- EDIT PRICE MODAL -->

<div id="priceModal" class="receipt-modal">

    <div class="restock-box">

        <h2>Edit Price</h2>

        <p id="priceProductName"></p>

        <p>
            Current Price:
            <strong id="currentPrice"></strong>
        </p>

        <label for="newPrice">
            New Selling Price
        </label>

        <input
            type="number"
            id="newPrice"
            min="1"
            placeholder="Enter new price"
        >

        <div class="receipt-buttons">

            <button id="savePriceButton">
                SAVE PRICE
            </button>

            <button id="cancelPriceButton">
                CANCEL
            </button>

        </div>

    </div>

</div>


    <script src="/pos/stock.js?v=9"></script>

</body>

</html>
